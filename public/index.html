<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NULLGARDEN</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="bar">
  <h1 class="mark">NULLGARDEN</h1>
  <div class="scn" role="tablist" aria-label="Dataset" id="scenarios"></div>
  <label class="trial" title="Only select when whole clusters were truly randomized uniformly within their batch or stratum. Cluster metadata alone does not establish randomization."><input type="checkbox" id="trialMode"> Registered cluster trial</label>
  <label class="trial-id">Protocol ID <input id="trialProtocol" type="text" maxlength="200" placeholder="Preregistered trial ID" disabled aria-label="Cluster randomization protocol identifier"></label>
  <label class="trial-id" title="Preregister the primary measured treatment outcome before inspecting any results. Must match an exact CSV feature column.">Outcome <input id="trialOutcome" type="text" maxlength="120" placeholder="Primary CSV feature" disabled aria-label="Preregistered primary trial outcome"></label>
  <label class="trial trial-assumption"><input type="checkbox" id="trialConstantEffect" disabled> Register a 95% confidence set: assume the same additive effect for every unit</label>
  <label class="load">Load CSV<input type="file" id="csvFile" accept=".csv,text/csv"></label>
  <span class="llm" id="llmState" title="Nemotron on Nebius Token Factory"></span>
</header>

<main class="stage">
  <section class="plate" aria-labelledby="plateTitle">
    <div class="plate-head">
      <div>
        <h2 id="plateTitle">Design</h2>
        <p class="cap" id="plateCap">Each column is a batch. Filled dot = label 1, ring = label 0.</p>
      </div>
      <button id="run" class="go" type="button">Run controls</button>
    </div>
    <div id="beds" class="beds" aria-live="polite"></div>
    <fieldset class="picks" id="picks"><legend>Controls to run</legend></fieldset>

    <div id="out" hidden>
      <section class="trial-effect" id="trialEffect" hidden aria-live="polite"></section>
      <p class="cap" id="classificationCap" hidden>Secondary diagnostic only: predicting treatment assignment from measurements is not a causal treatment-effect estimate.</p>
      <div class="verdict" id="verdict" role="status"></div>
      <div class="ladder" id="ladder"></div>
      <ul class="findings" id="findings"></ul>

      <button id="dl" class="quiet" type="button">Download report (Markdown)</button>
    </div>
  </section>

  <aside class="side" aria-label="Nemotron">
    <h2>Ask Nemotron what could be exploited</h2>
    <label for="note" class="sr">What do you suspect</label>
    <textarea id="note" rows="3" placeholder="Optional: what makes you suspect a shortcut? e.g. samples were processed on different days"></textarea>
    <button id="ask" class="go alt" type="button">Propose hypotheses</button>
    <p class="msg" id="askMsg" role="status"></p>
    <ol class="hyp" id="hyp"></ol>

    <h2 class="sp">Plain-language read-out</h2>
    <button id="explain" class="quiet" type="button" disabled>Explain results with Nemotron</button>
    <p class="msg" id="exMsg" role="status"></p>
    <div id="explainOut" class="explain" hidden></div>
  </aside>
</main>
<script src="/app.js" type="module"></script>
</body>
</html>
